{% load static %}
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign in | Danjuma Bread</title><link rel="stylesheet" href="{% static 'bakery/site.css' %}"></head>
<body>
  <header class="site-header"><a class="brand" href="{% url 'bakery:storefront' %}"><strong>DANJUMA BREAD</strong></a></header>
  <main class="menu-section">
    <h1>Sign in</h1>
    {% if form.errors %}<p role="alert">Email or password was not recognized.</p>{% endif %}
    <form method="post">{% csrf_token %}
      <input type="hidden" name="next" value="{{ next }}">
      {{ form.as_p }}
      <button type="submit" class="button">Sign in</button>
    </form>
    <p>New here? <a href="{% url 'bakery:register' %}">Create a customer account</a>.</p>
  </main>
</body>
</html>
